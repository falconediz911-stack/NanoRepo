name: Validate NanoRepo

on:
  push:
    branches:
      - main
      - "repo-extreme-ultra-pro/**"
      - reponanoult
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanorepo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run CPU discovery unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository structure and PKGBUILDs
        run: python tools/validate_repo.py

  package-build:
    name: Build package archives in Arch
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-pacman.yml
    permissions:
      contents: read
