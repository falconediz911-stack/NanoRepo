# NanoOS (nanoos-system): network and desktop responsiveness.
# BBR + fq keep latency low while the line is busy (big downloads/uploads)
# and recover faster from packet loss.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
# File managers, IDEs and sync tools watch many files.
fs.inotify.max_user_watches = 524288
