# NanoOS package repositories.
# Packages are built and signed by the NanoOS project and hosted as GitHub
# release assets on https://github.com/falconediz911-stack/NanoRepo.
# Signatures are always required; the key is installed by this package
# (fingerprint D35A46A77EDBFD4F069B71ACB329E36F597CD358).

# NanoInstall: every NanoOS tool and app (Welcome, Control Center, Game Mode,
# system updates). Listed first so NanoOS tools always come from here.
[nanoinstall]
SigLevel = Required DatabaseRequired
Server = https://github.com/falconediz911-stack/NanoRepo/releases/download/repo-nanoinstall

[nanoos]
SigLevel = Required DatabaseRequired
Server = https://github.com/falconediz911-stack/NanoRepo/releases/download/repo-nanoos

[nanoos-gaming]
SigLevel = Required DatabaseRequired
Server = https://github.com/falconediz911-stack/NanoRepo/releases/download/repo-nanoos-gaming
